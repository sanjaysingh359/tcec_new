# ─── Server ────────────────────────────────────────────────────────────────
server.port=8082

# ─── DataSource (PostgreSQL 17 portable) ───────────────────────────────────
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/dcmsme_tcec
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Logging ───────────────────────────────────────────────────────────────
logging.level.com.tcec=INFO
logging.level.org.springframework.web=INFO

# ─── Applications (one database each; chosen on the landing page) ─────────
# TCEC uses spring.datasource.url above. Username/password default to spring.datasource.*.
app.list=tcec,tcsp,ab
app.datasource.tcsp.url=jdbc:postgresql://127.0.0.1:5432/dcmsme_tcsp
# AB (autonomous bodies / tool rooms) — legacy MySQL database dcmsme_tool
app.datasource.ab.url=jdbc:postgresql://127.0.0.1:5432/dcmsme_tool
